<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    #app {
      background: white;
      padding: 24px;
      width: 340px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #app .progress {
      color: #666;
      font-size: 14px;
      margin: 0 0 8px;
    }
    #app h2, #app h3 {
      margin: 8px 0 16px;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fafafa;
    }
    button:hover {
      background: #e9e9e9;
    }
    .score {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById("app");

    const questions = [
      {
        q: "What does JS stand for?",
        options: ["JavaSource", "JavaScript", "JustScript"],
        answer: 1
      },
      {
        q: "Which of these runs in the browser?",
        options: ["Python", "C++", "JavaScript"],
        answer: 2
      },
      {
        q: "How do you print 'hi' to the console?",
        options: ["print('hi')", "console.log('hi')", "echo 'hi'"],
        answer: 1
      },
      {
        q: "Which keyword creates a variable that can be changed?",
        options: ["const", "let", "varr"],
        answer: 1
      },
      {
        q: "What does '===' check in JavaScript?",
        options: ["Only the value", "Value and type", "Only the type"],
        answer: 1
      }
    ];

    let current = 0;
    let score = 0;

    function startScreen() {
      app.innerHTML = `
        <h2>JS Quiz</h2>
        <p>${questions.length} quick questions about JavaScript basics.</p>
        <button onclick="startQuiz()">Start Quiz</button>
      `;
    }

    function startQuiz() {
      current = 0;
      score = 0;
      showQuestion();
    }

    function showQuestion() {
      const q = questions[current];
      app.innerHTML = `
        <p class="progress">Question ${current + 1} of ${questions.length}</p>
        <h3>${q.q}</h3>
        ${q.options
          .map(
            (opt, i) =>
              `<button onclick="answer(${i})">${opt}</button>`
          )
          .join("")}
      `;
    }

    function answer(choice) {
      if (choice === questions[current].answer) score++;
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      let message;
      if (score === questions.length) {
        message = "Perfect score! Well done.";
      } else if (score >= questions.length / 2) {
        message = "Good job! Try again for a perfect score.";
      } else {
        message = "Keep practicing and try again.";
      }
      app.innerHTML = `
        <h2>Quiz Finished!</h2>
        <p class="score">Score: ${score}/${questions.length}</p>
        <p>${message}</p>
        <button onclick="startQuiz()">Play Again</button>
      `;
    }

    startScreen();
  </script>
</body>
</html>
